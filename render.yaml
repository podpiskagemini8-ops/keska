services:
  - type: web
    name: keska-raffle-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u -m rafflebot.web
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
